# Keeps pytest's rootdir *inside* tests/. The add-on root has an __init__.py
# (it IS the add-on package), and its hyphenated directory name is not a valid
# module name — if rootdir sat at the add-on root, pytest would try to collect
# and import that __init__.py as a package and fail. Run tests with:
#   python -m pytest tests/  (from the add-on root)
[pytest]
addopts = -p no:cacheprovider
